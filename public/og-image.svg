<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Multiserwis Kutno - Kompleksowe Usługi dla Przemysłu</title>
  <desc id="desc">Oficjalna grafika podglądu (Open Graph) dla Multiserwis Kutno</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="240" cy="180" r="160" fill="#F59E0B" opacity="0.16" filter="url(#glow)" />
  <circle cx="980" cy="480" r="180" fill="#F59E0B" opacity="0.10" filter="url(#glow)" />

  <!-- Top Header -->
  <g transform="translate(54, 44)">
    <!-- Emblem Box -->
    <rect width="58" height="58" rx="16" fill="#F59E0B" />
    <g transform="translate(10, 10) scale(0.176)">
      <path stroke-linecap="round" transform="matrix(0.746388, 0.0387904, -0.0387904, 0.746388, 22.667593, -4.308565)" fill="none" stroke-linejoin="miter" d="M 23.70514 61.062752 C 88.201608 1.617793 152.695967 1.646833 217.198386 61.144111" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(0.572096, 0.480943, -0.480943, 0.572096, 39.832766, 27.664762)" fill="none" stroke-linejoin="miter" d="M 16.498401 16.499856 L 262.297368 16.498863" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(-0.747097, -0.0211284, 0.0211284, -0.747097, 195.863611, 216.068173)" fill="none" stroke-linejoin="miter" d="M 23.693011 64.961328 C 89.360518 0.319538 155.026848 0.34474 220.697519 65.047236" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(0.572399, 0.480583, -0.480583, 0.572399, 15.864842, 58.787771)" fill="none" stroke-linejoin="miter" d="M 16.497529 16.498899 L 174.894069 16.502823" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(0.578067, -0.47375, 0.47375, 0.578067, 141.691865, 104.468184)" fill="none" stroke-linejoin="miter" d="M 16.501648 16.49805 L 81.315506 16.502295" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(-0.0335867, -0.746641, 0.746641, -0.0335867, 2.676521, 156.398469)" fill="none" stroke-linejoin="miter" d="M 21.302331 22.130225 C 50.148174 14.617523 78.990668 14.622718 107.829577 22.151032" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(-0.0224359, 0.747059, -0.747059, -0.0224359, 215.48332, 59.708109)" fill="none" stroke-linejoin="miter" d="M 21.352238 22.081857 C 49.704086 14.631591 78.055025 14.637675 106.410437 22.105175" stroke="#ffffff" stroke-width="32"/>
      <path stroke-linecap="round" transform="matrix(0.549434, -0.506678, 0.506678, 0.549434, 91.588072, 151.143562)" fill="none" stroke-linejoin="miter" d="M 16.502923 16.50019 L 31.212682 16.500169" stroke="#ffffff" stroke-width="32"/>
    </g>
    <!-- Brand Text -->
    <text x="74" y="32" font-family="Montserrat, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">MULTI<tspan fill="#F59E0B">SERWIS</tspan></text>
    <text x="74" y="50" font-family="Montserrat, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3" fill="#CBD5E1">PROFESJONALNE USŁUGI</text>
  </g>

  <!-- Location Pill -->
  <g transform="translate(930, 48)">
    <rect width="216" height="42" rx="21" fill="#111827" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="22" cy="21" r="4.5" fill="#F59E0B" />
    <text x="36" y="26" font-family="Montserrat, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#E2E8F0">KUTNO • CAŁA POLSKA</text>
  </g>

  <!-- Center Badge -->
  <g transform="translate(425, 170)">
    <rect width="350" height="38" rx="19" fill="#111827" fill-opacity="0.85" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>
    <text x="175" y="24" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="13.5" font-weight="800" letter-spacing="3" fill="#F59E0B">KOMPLEKSOWE WSPARCIE PRZEMYSŁU</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="278" text-anchor="middle" font-family="Oswald, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="1">SIŁA <tspan fill="url(#gold)">PRECYZJI</tspan></text>
  <text x="600" y="356" text-anchor="middle" font-family="Oswald, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="1">W PRZEMYŚLE</text>

  <!-- Description Box -->
  <g transform="translate(110, 396)">
    <rect width="980" height="120" rx="16" fill="#0B1220" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="490" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="18.5" fill="#F1F5F9">Obsługujemy zakłady przemysłowe w obszarach wynajmu maszyn, relokacji linii, UDT, elektryki,</text>
    <text x="490" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="18.5" fill="#F1F5F9">spawalnictwa i hydrauliki przemysłowej. Jeden partner do realizacji wymagających zadań</text>
    <text x="490" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="18.5" fill="#F1F5F9">na produkcji, budowie i w utrzymaniu ruchu.</text>
  </g>

  <!-- Footer Line & Pillars -->
  <line x1="54" y1="560" x2="1146" y2="560" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
  <g transform="translate(54, 586)">
    <circle cx="4" cy="-4" r="4" fill="#F59E0B" />
    <text x="16" y="0" font-family="Inter, sans-serif" font-size="13.5" fill="#E2E8F0">Wynajem Maszyn i Podestów</text>
  </g>
  <g transform="translate(310, 586)">
    <circle cx="4" cy="-4" r="4" fill="#F59E0B" />
    <text x="16" y="0" font-family="Inter, sans-serif" font-size="13.5" fill="#E2E8F0">Relokacja i Montaż Linii</text>
  </g>
  <g transform="translate(530, 586)">
    <circle cx="4" cy="-4" r="4" fill="#F59E0B" />
    <text x="16" y="0" font-family="Inter, sans-serif" font-size="13.5" fill="#E2E8F0">Konserwacja i Dozór UDT</text>
  </g>
  <g transform="translate(760, 586)">
    <circle cx="4" cy="-4" r="4" fill="#F59E0B" />
    <text x="16" y="0" font-family="Inter, sans-serif" font-size="13.5" fill="#E2E8F0">Spawalnictwo i Hydraulika</text>
  </g>
  <g transform="translate(1015, 586)">
    <circle cx="4" cy="-4" r="4" fill="#34D399" />
    <text x="16" y="0" font-family="Montserrat, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Wycena w 24h</text>
  </g>
</svg>